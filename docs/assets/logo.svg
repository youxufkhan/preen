<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 160" width="720" height="160">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1929"/>
      <stop offset="40%" stop-color="#0d233a"/>
      <stop offset="80%" stop-color="#062e3d"/>
      <stop offset="100%" stop-color="#04383a"/>
    </linearGradient>

    <linearGradient id="strokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7"/>
      <stop offset="35%" stop-color="#00e699" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="85%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="25%" stop-color="#00e699"/>
      <stop offset="70%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#e0f2fe"/>
      <stop offset="70%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="leftVaneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="40%" stop-color="#00e699"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>

    <linearGradient id="shaftGrad" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#00e699" stop-opacity="0.1"/>
      <stop offset="20%" stop-color="#00e699"/>
      <stop offset="70%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Left Icon Emblem (128x128 at x=16, y=16) -->
  <g transform="translate(16, 16) scale(0.28)">
    <rect x="16" y="16" width="440" height="440" rx="98" fill="url(#cardGrad)"/>
    <rect x="16" y="16" width="440" height="440" rx="98" fill="none" stroke="url(#strokeGrad)" stroke-width="3"/>
    <path d="M 18,114 C 18,61 61,18 114,18 L 358,18 C 411,18 454,61 454,114 L 454,190 C 350,240 150,220 18,160 Z" fill="#ffffff" opacity="0.04"/>

    <path d="M 175,372 C 158,350 148,318 152,286 C 172,298 198,314 212,334 C 200,358 186,370 175,372 Z" fill="url(#leftVaneGrad)" opacity="0.8"/>
    <path d="M 156,280 C 160,242 178,206 206,178 C 224,196 242,224 246,252 C 218,252 184,264 156,280 Z" fill="url(#leftVaneGrad)" opacity="0.9"/>
    <path d="M 212,172 C 244,138 290,104 340,78 C 342,98 334,128 316,154 C 284,170 248,172 212,172 Z" fill="url(#whiteGrad)" opacity="0.95"/>
    <path d="M 346,72 C 372,82 388,102 386,124 C 362,142 328,154 298,160 C 308,130 326,98 346,72 Z" fill="url(#whiteGrad)"/>
    <path d="M 384,132 C 402,154 404,180 392,204 C 356,212 312,208 276,198 C 314,180 354,158 384,132 Z" fill="url(#cyanGrad)"/>
    <path d="M 388,214 C 394,238 384,264 362,284 C 328,278 284,260 252,238 C 298,236 352,230 388,214 Z" fill="url(#cyanGrad)" opacity="0.95"/>
    <path d="M 356,292 C 344,316 318,336 286,344 C 262,330 238,298 226,272 C 264,286 316,294 356,292 Z" fill="url(#cyanGrad)" opacity="0.85"/>
    <path d="M 278,350 C 254,364 226,368 202,364 C 204,348 214,332 228,320 C 248,336 264,346 278,350 Z" fill="url(#leftVaneGrad)" opacity="0.7"/>
    <path d="M 160,396 C 172,360 198,300 242,230 C 284,164 326,108 348,70 C 346,74 306,128 266,192 C 224,260 196,324 178,396 Z" fill="url(#shaftGrad)" filter="url(#softGlow)"/>
    <g transform="translate(378, 64)" filter="url(#softGlow)">
      <circle cx="0" cy="0" r="22" fill="#38bdf8" opacity="0.35"/>
      <path d="M 0,-30 Q 0,0 30,0 Q 0,0 0,30 Q 0,0 -30,0 Q 0,0 0,-30 Z" fill="#ffffff"/>
      <circle cx="0" cy="0" r="4" fill="#5eead4"/>
    </g>
  </g>

  <!-- Typography -->
  <text x="176" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Ubuntu, 'Inter', sans-serif" font-size="68" font-weight="900" fill="url(#textGrad)" letter-spacing="4">PREEN</text>
  <text x="180" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Ubuntu, Cantarell, sans-serif" font-size="16" font-weight="500" fill="#94a3b8" letter-spacing="0.5">Clean, uninstall, analyze, and monitor Linux</text>
</svg>