<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1929"/>
      <stop offset="40%" stop-color="#0d233a"/>
      <stop offset="80%" stop-color="#062e3d"/>
      <stop offset="100%" stop-color="#04383a"/>
    </linearGradient>

    <linearGradient id="squircleStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7"/>
      <stop offset="35%" stop-color="#00e699" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00e699" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="25%" stop-color="#00e699"/>
      <stop offset="70%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#e0f2fe"/>
      <stop offset="70%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="leftVaneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="40%" stop-color="#00e699"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>

    <linearGradient id="shaftGrad" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#00e699" stop-opacity="0.1"/>
      <stop offset="20%" stop-color="#00e699"/>
      <stop offset="70%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="ambientLight" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="35" result="blur"/>
    </filter>

    <filter id="cardShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Ambient Light -->
  <circle cx="340" cy="180" r="160" fill="#00e699" opacity="0.15" filter="url(#ambientLight)"/>
  <circle cx="180" cy="300" r="140" fill="#0284c7" opacity="0.20" filter="url(#ambientLight)"/>

  <!-- Squircle Base -->
  <rect x="36" y="36" width="440" height="440" rx="98" fill="url(#bgGrad)" filter="url(#cardShadow)"/>
  <rect x="36" y="36" width="440" height="440" rx="98" fill="none" stroke="url(#squircleStroke)" stroke-width="2.5"/>

  <!-- Top Glass Sheen -->
  <path d="M 38,134 C 38,81 81,38 134,38 L 378,38 C 431,38 474,81 474,134 L 474,210 C 370,260 170,240 38,180 Z" fill="#ffffff" opacity="0.04"/>

  <!-- Preen Feather Emblem -->
  <g id="preen-feather">
    <!-- Left Vanes -->
    <path d="M 175,372 C 158,350 148,318 152,286 C 172,298 198,314 212,334 C 200,358 186,370 175,372 Z" fill="url(#leftVaneGrad)" opacity="0.8"/>
    <path d="M 156,280 C 160,242 178,206 206,178 C 224,196 242,224 246,252 C 218,252 184,264 156,280 Z" fill="url(#leftVaneGrad)" opacity="0.9"/>
    <path d="M 212,172 C 244,138 290,104 340,78 C 342,98 334,128 316,154 C 284,170 248,172 212,172 Z" fill="url(#whiteGrad)" opacity="0.95"/>

    <!-- Right Vanes -->
    <path d="M 346,72 C 372,82 388,102 386,124 C 362,142 328,154 298,160 C 308,130 326,98 346,72 Z" fill="url(#whiteGrad)"/>
    <path d="M 384,132 C 402,154 404,180 392,204 C 356,212 312,208 276,198 C 314,180 354,158 384,132 Z" fill="url(#cyanGrad)"/>
    <path d="M 388,214 C 394,238 384,264 362,284 C 328,278 284,260 252,238 C 298,236 352,230 388,214 Z" fill="url(#cyanGrad)" opacity="0.95"/>
    <path d="M 356,292 C 344,316 318,336 286,344 C 262,330 238,298 226,272 C 264,286 316,294 356,292 Z" fill="url(#cyanGrad)" opacity="0.85"/>
    <path d="M 278,350 C 254,364 226,368 202,364 C 204,348 214,332 228,320 C 248,336 264,346 278,350 Z" fill="url(#leftVaneGrad)" opacity="0.7"/>

    <!-- Spine -->
    <path d="M 160,396 C 172,360 198,300 242,230 C 284,164 326,108 348,70 C 346,74 306,128 266,192 C 224,260 196,324 178,396 Z" fill="url(#shaftGrad)" filter="url(#softGlow)"/>

    <!-- Calamus Base -->
    <path d="M 160,396 L 148,418 C 146,422 142,422 140,418 L 144,402 C 148,394 154,388 160,396 Z" fill="#00e699" opacity="0.6"/>

    <!-- Clean Shine Star -->
    <g transform="translate(378, 64)" filter="url(#softGlow)">
      <circle cx="0" cy="0" r="22" fill="#38bdf8" opacity="0.35"/>
      <circle cx="0" cy="0" r="12" fill="#00e699" opacity="0.5"/>
      <path d="M 0,-30 Q 0,0 30,0 Q 0,0 0,30 Q 0,0 -30,0 Q 0,0 0,-30 Z" fill="#ffffff"/>
      <path d="M -10,-10 L 10,10 M -10,10 L 10,-10" stroke="#a7f3d0" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="4" fill="#ffffff"/>
    </g>

    <!-- Small Sparkle -->
    <g transform="translate(422, 118)">
      <circle cx="0" cy="0" r="8" fill="#38bdf8" opacity="0.25"/>
      <path d="M 0,-14 Q 0,0 14,0 Q 0,0 0,14 Q 0,0 -14,0 Q 0,0 0,-14 Z" fill="#ffffff" opacity="0.9"/>
      <circle cx="0" cy="0" r="2" fill="#5eead4"/>
    </g>

    <g transform="translate(132, 260)">
      <path d="M 0,-8 Q 0,0 8,0 Q 0,0 0,8 Q 0,0 -8,0 Q 0,0 0,-8 Z" fill="#00e699" opacity="0.75"/>
    </g>
  </g>
</svg>