<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101d"/>
      <stop offset="50%" stop-color="#0c1a29"/>
      <stop offset="100%" stop-color="#081420"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1929"/>
      <stop offset="40%" stop-color="#0d233a"/>
      <stop offset="80%" stop-color="#062e3d"/>
      <stop offset="100%" stop-color="#04383a"/>
    </linearGradient>

    <linearGradient id="strokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#00e699" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#f0fdf4"/>
      <stop offset="80%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="25%" stop-color="#00e699"/>
      <stop offset="70%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#e0f2fe"/>
      <stop offset="70%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="leftVaneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="40%" stop-color="#00e699"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>

    <linearGradient id="shaftGrad" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#00e699" stop-opacity="0.1"/>
      <stop offset="20%" stop-color="#00e699"/>
      <stop offset="70%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="ambientLight" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60" result="blur"/>
    </filter>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Banner Background -->
  <rect width="1200" height="380" rx="16" fill="url(#bgGrad)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="190" r="180" fill="#00e699" opacity="0.12" filter="url(#ambientLight)"/>
  <circle cx="850" cy="160" r="220" fill="#0284c7" opacity="0.12" filter="url(#ambientLight)"/>

  <!-- Left Icon Emblem (230x230) -->
  <g transform="translate(80, 75) scale(0.52)" filter="url(#dropShadow)">
    <rect x="36" y="36" width="440" height="440" rx="98" fill="url(#cardGrad)"/>
    <rect x="36" y="36" width="440" height="440" rx="98" fill="none" stroke="url(#strokeGrad)" stroke-width="3"/>
    <path d="M 38,134 C 38,81 81,38 134,38 L 378,38 C 431,38 474,81 474,134 L 474,210 C 370,260 170,240 38,180 Z" fill="#ffffff" opacity="0.04"/>

    <path d="M 175,372 C 158,350 148,318 152,286 C 172,298 198,314 212,334 C 200,358 186,370 175,372 Z" fill="url(#leftVaneGrad)" opacity="0.8"/>
    <path d="M 156,280 C 160,242 178,206 206,178 C 224,196 242,224 246,252 C 218,252 184,264 156,280 Z" fill="url(#leftVaneGrad)" opacity="0.9"/>
    <path d="M 212,172 C 244,138 290,104 340,78 C 342,98 334,128 316,154 C 284,170 248,172 212,172 Z" fill="url(#whiteGrad)" opacity="0.95"/>

    <path d="M 346,72 C 372,82 388,102 386,124 C 362,142 328,154 298,160 C 308,130 326,98 346,72 Z" fill="url(#whiteGrad)"/>
    <path d="M 384,132 C 402,154 404,180 392,204 C 356,212 312,208 276,198 C 314,180 354,158 384,132 Z" fill="url(#cyanGrad)"/>
    <path d="M 388,214 C 394,238 384,264 362,284 C 328,278 284,260 252,238 C 298,236 352,230 388,214 Z" fill="url(#cyanGrad)" opacity="0.95"/>
    <path d="M 356,292 C 344,316 318,336 286,344 C 262,330 238,298 226,272 C 264,286 316,294 356,292 Z" fill="url(#cyanGrad)" opacity="0.85"/>
    <path d="M 278,350 C 254,364 226,368 202,364 C 204,348 214,332 228,320 C 248,336 264,346 278,350 Z" fill="url(#leftVaneGrad)" opacity="0.7"/>

    <path d="M 160,396 C 172,360 198,300 242,230 C 284,164 326,108 348,70 C 346,74 306,128 266,192 C 224,260 196,324 178,396 Z" fill="url(#shaftGrad)" filter="url(#softGlow)"/>

    <g transform="translate(378, 64)" filter="url(#softGlow)">
      <circle cx="0" cy="0" r="24" fill="#38bdf8" opacity="0.35"/>
      <path d="M 0,-30 Q 0,0 30,0 Q 0,0 0,30 Q 0,0 -30,0 Q 0,0 0,-30 Z" fill="#ffffff"/>
      <circle cx="0" cy="0" r="4" fill="#5eead4"/>
    </g>
    <g transform="translate(422, 118)">
      <path d="M 0,-14 Q 0,0 14,0 Q 0,0 0,14 Q 0,0 -14,0 Q 0,0 0,-14 Z" fill="#ffffff" opacity="0.9"/>
    </g>
  </g>

  <!-- Typography and Characteristics -->
  <g transform="translate(360, 0)">
    <text x="0" y="162" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Ubuntu, 'Inter', sans-serif" font-size="82" font-weight="900" fill="url(#textGrad)" letter-spacing="4">PREEN</text>
    <text x="4" y="206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Ubuntu, Cantarell, sans-serif" font-size="20" font-weight="500" fill="#94a3b8" letter-spacing="0.3">Clean, uninstall, analyze, and monitor Linux</text>

    <!-- Badges / Characteristics -->
    <g transform="translate(4, 244)">
      <!-- KDE Kirigami UI -->
      <g transform="translate(0, 0)">
        <rect width="140" height="32" rx="6" fill="#141d2b" stroke="#253549" stroke-width="1"/>
        <text x="14" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#cbd5e1">KDE Kirigami UI</text>
      </g>

      <!-- Terminal CLI -->
      <g transform="translate(152, 0)">
        <rect width="116" height="32" rx="6" fill="#141d2b" stroke="#253549" stroke-width="1"/>
        <text x="14" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#cbd5e1">Terminal CLI</text>
      </g>

      <!-- Delete Safety -->
      <g transform="translate(280, 0)">
        <rect width="142" height="32" rx="6" fill="#141d2b" stroke="#253549" stroke-width="1"/>
        <text x="14" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#cbd5e1">Safety validator</text>
      </g>

      <!-- No Background Services -->
      <g transform="translate(434, 0)">
        <rect width="180" height="32" rx="6" fill="#141d2b" stroke="#253549" stroke-width="1"/>
        <text x="14" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#cbd5e1">No background service</text>
      </g>
    </g>
  </g>
</svg>